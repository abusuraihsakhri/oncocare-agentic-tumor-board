services:
  oncocare:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:?Generate a random AUDIT_SECRET_KEY}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:?Generate a random API_ACCESS_TOKEN}
      MODEL_PROVIDER: mock
    restart: unless-stopped
