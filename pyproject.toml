[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oncocare-agentic-tumor-board"
version = "1.0.1"
description = "Educational molecular tumor board and rule-based quality-control demonstrations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Medical Science Apps",
]
dependencies = [
  "pydantic>=2.5,<3",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
mtb-orchestrator = "mtb_orchestrator.cli:main"
oncocare-audit = "cli:main"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "mtb_orchestrator_app"]

[tool.setuptools.packages.find]
include = ["agents", "agents.*", "mtb_orchestrator", "mtb_orchestrator.*"]

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/oncocare-agentic-tumor-board"
Repository = "https://github.com/abusuraihsakhri/oncocare-agentic-tumor-board"
