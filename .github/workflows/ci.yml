name: Tests and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      AUDIT_SECRET_KEY: "ci-only-test-key-not-for-production-2026"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Run test suite
        run: python -m pytest -q
      - name: Compile Python modules
        run: python -m compileall -q agents mtb_orchestrator cli.py enrichment.py simulator.py
      - name: Verify audit integrity in an independent process
        run: |
          python - <<'PY'
          from agents.base import AuditLogger, PHIGuard, SecurityException
          AuditLogger.log("ci", "test", "INTEGRITY_TEST", {"case": "synthetic"})
          assert AuditLogger.verify_integrity()
          try:
              PHIGuard.assert_no_phi("MRN-123456")
          except SecurityException:
              pass
          else:
              raise AssertionError("PHI pattern detection failed")
          PY
      - name: Check browser JavaScript syntax and demonstration rules
        run: |
          node --check web/app.js
          node web/demo-tests.js
